name: Source compatibility preflight

on:
  push:
    branches: [main]
    paths:
      - 'build.sh'
      - 'scripts/**'
      - '.github/workflows/preflight.yml'
  pull_request:
    branches: [main]
    paths:
      - 'build.sh'
      - 'scripts/**'
      - '.github/workflows/preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Lint scripts and audit upstream compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Inspect runner resources
        shell: bash
        run: |
          set -euo pipefail
          echo "===== Disk space / filesystem ====="
          df -hT
          echo "===== Inode availability ====="
          df -ih
          echo "===== Memory ====="
          free -h || true
          echo "===== CPU count ====="
          nproc
          echo "This workflow only measures disk and memory; it does not delete runner toolchains."

      - name: Install ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y shellcheck

      - name: ShellCheck (errors only)
        shell: bash
        run: shellcheck --severity=error build.sh scripts/*.sh

      - name: Bash syntax and lightweight manifest/device tests
        shell: bash
        run: bash scripts/ci_precheck.sh

      - name: Extended upstream compatibility audit
        shell: bash
        run: bash scripts/ci_upstream_audit.sh

      - name: Check patch whitespace
        shell: bash
        run: git diff --check
